name: Deploy

# Triggered after a PR merges to main (= push event on main).
# Runs CI as a gate, applies Prisma migrations, then deploys backend + frontend
# to Vercel via the Vercel CLI in parallel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Apply Prisma migrations
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (backend only)
        run: pnpm install --frozen-lockfile=false

      - name: Apply migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-backend:
    name: Deploy backend (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      # Vercel CLI reads VERCEL_TOKEN automatically. Passing it as `--token`
      # on the command line gets corrupted by GitHub's automatic secret
      # redaction (literal `***` substitution), so we use the env var instead.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build (Vercel)
        run: vercel build --prod

      - name: Deploy (Vercel)
        run: vercel deploy --prebuilt --prod

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --cwd ./frontend

      - name: Build (Vercel)
        run: vercel build --prod --cwd ./frontend

      - name: Deploy (Vercel)
        run: vercel deploy --prebuilt --prod --cwd ./frontend
